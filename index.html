<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Theme Music</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at center,
    #081320 0%,
    #02060d 45%,
    #000000 100%);
}

/* BACKGROUND PARTICLES */

.particles{

    position:absolute;
    inset:0;
    overflow:hidden;
}

.particles span{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#66bfff;

    box-shadow:
    0 0 12px rgba(102,191,255,0.9),
    0 0 24px rgba(102,191,255,0.3);

    animation:float linear infinite;
}

@keyframes float{

    from{
        transform:translateY(100vh);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

/* PLAYER */

.player{

    position:relative;

    width:440px;

    padding:26px;

    border-radius:34px;

    overflow:hidden;

    background:
    linear-gradient(
    145deg,
    rgba(6,12,24,0.96),
    rgba(0,0,0,0.95));

    border:1px solid rgba(102,191,255,0.12);

    backdrop-filter:blur(18px);

    box-shadow:
    0 0 80px rgba(0,0,0,1),
    inset 0 0 35px rgba(102,191,255,0.05);
}

/* GLOW BORDER */

.player::before{

    content:"";

    position:absolute;
    inset:-2px;

    border-radius:36px;

    background:
    linear-gradient(
    135deg,
    #00152e,
    #0f4c81,
    #63b9ff,
    #00152e);

    background-size:300% 300%;

    animation:borderMove 10s linear infinite;

    z-index:-1;

    filter:blur(18px);

    opacity:0.45;
}

@keyframes borderMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* TITLE */

.title{

    text-align:center;

    color:#9ad8ff;

    font-size:27px;

    font-weight:800;

    letter-spacing:4px;

    text-transform:uppercase;

    margin-bottom:20px;

    white-space:nowrap;

    text-shadow:
    0 0 12px rgba(102,191,255,0.7),
    0 0 30px rgba(102,191,255,0.25);

    animation:titlePulse 4s ease-in-out infinite;
}

@keyframes titlePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }
}

/* VISUALIZER */

.visualizer{

    position:relative;

    height:125px;

    border-radius:24px;

    overflow:hidden;

    background:
    linear-gradient(
    to bottom,
    rgba(255,255,255,0.015),
    rgba(102,191,255,0.03));

    border:1px solid rgba(102,191,255,0.08);

    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CENTER GLOW */

.beam{

    position:absolute;

    width:180px;
    height:180px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(102,191,255,0.18),
    transparent 70%);

    filter:blur(35px);

    animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
        opacity:0.45;
    }

    50%{
        transform:scale(1.2);
        opacity:1;
    }
}

/* SOUND RINGS */

.ring{

    position:absolute;

    border:1px solid rgba(102,191,255,0.08);

    border-radius:50%;

    animation:ringPulse 5s infinite;
}

.ring1{
    width:120px;
    height:120px;
}

.ring2{
    width:190px;
    height:190px;
    animation-delay:2s;
}

@keyframes ringPulse{

    0%{
        transform:scale(0.8);
        opacity:0;
    }

    50%{
        opacity:0.35;
    }

    100%{
        transform:scale(1.2);
        opacity:0;
    }
}

/* LIGHT SWEEP */

.light-sweep{

    position:absolute;

    width:120px;
    height:220px;

    background:
    linear-gradient(
    to right,
    transparent,
    rgba(102,191,255,0.08),
    transparent);

    transform:rotate(18deg);

    animation:sweep 6s linear infinite;
}

@keyframes sweep{

    from{
        left:-160px;
    }

    to{
        left:520px;
    }
}

/* CONNECTED WAVES */

.wave-line{

    position:relative;

    width:100%;
    height:80px;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    gap:5px;

    padding:0 18px;

    z-index:5;
}

/* CONNECTOR */

.wave-line::before{

    content:"";

    position:absolute;

    width:92%;
    height:2px;

    top:52%;

    background:
    linear-gradient(
    90deg,
    transparent,
    rgba(102,191,255,0.35),
    transparent);

    filter:blur(2px);
}

/* BARS */

.bar{

    position:relative;

    width:6px;

    border-radius:20px;

    background:
    linear-gradient(
    to top,
    #0d3964,
    #54b4ff,
    #d3efff);

    box-shadow:
    0 0 14px rgba(102,191,255,0.35),
    0 0 28px rgba(102,191,255,0.12);

    transform-origin:bottom;
}

/* WAVE GLOW */

.bar::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:18px;
    height:18px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(102,191,255,0.18),
    transparent 70%);
}

/* SMALLER INITIAL HEIGHTS */

.b1{height:12px;}
.b2{height:22px;}
.b3{height:38px;}
.b4{height:55px;}
.b5{height:42px;}
.b6{height:30px;}
.b7{height:52px;}
.b8{height:68px;}
.b9{height:54px;}
.b10{height:36px;}
.b11{height:20px;}
.b12{height:12px;}

/* REALISTIC MOTION */

.playing .b1{animation:eq1 1s infinite ease-in-out;}
.playing .b2{animation:eq2 1.2s infinite ease-in-out;}
.playing .b3{animation:eq3 0.8s infinite ease-in-out;}
.playing .b4{animation:eq4 1.4s infinite ease-in-out;}
.playing .b5{animation:eq5 1s infinite ease-in-out;}
.playing .b6{animation:eq6 1.1s infinite ease-in-out;}
.playing .b7{animation:eq7 0.75s infinite ease-in-out;}
.playing .b8{animation:eq8 1.5s infinite ease-in-out;}
.playing .b9{animation:eq9 0.9s infinite ease-in-out;}
.playing .b10{animation:eq10 1.2s infinite ease-in-out;}
.playing .b11{animation:eq11 1s infinite ease-in-out;}
.playing .b12{animation:eq12 0.85s infinite ease-in-out;}

/* LOWER REALISTIC WAVES */

@keyframes eq1{
0%,100%{height:12px;}
50%{height:28px;}
}

@keyframes eq2{
0%,100%{height:22px;}
50%{height:42px;}
}

@keyframes eq3{
0%,100%{height:38px;}
50%{height:65px;}
}

@keyframes eq4{
0%,100%{height:55px;}
50%{height:85px;}
}

@keyframes eq5{
0%,100%{height:42px;}
50%{height:70px;}
}

@keyframes eq6{
0%,100%{height:30px;}
50%{height:55px;}
}

@keyframes eq7{
0%,100%{height:52px;}
50%{height:82px;}
}

@keyframes eq8{
0%,100%{height:68px;}
50%{height:45px;}
}

@keyframes eq9{
0%,100%{height:54px;}
50%{height:88px;}
}

@keyframes eq10{
0%,100%{height:36px;}
50%{height:62px;}
}

@keyframes eq11{
0%,100%{height:20px;}
50%{height:42px;}
}

@keyframes eq12{
0%,100%{height:12px;}
50%{height:26px;}
}

/* STATUS */

.status{

    text-align:center;

    color:#9ad8ff;

    font-size:11px;

    letter-spacing:4px;

    margin-bottom:14px;

    opacity:0;

    transition:0.4s ease;
}

.playing .status{
    opacity:1;
}

/* AUDIO */

audio{

    width:100%;

    border-radius:18px;

    filter:
    drop-shadow(0 0 10px rgba(102,191,255,0.18));
}

/* TIMER */

.timer{

    margin-top:12px;

    display:flex;
    justify-content:space-between;

    color:rgba(255,255,255,0.45);

    font-size:12px;
}

</style>

</head>

<body>

<!-- PARTICLES -->

<div class="particles">

<span style="left:10%; animation-duration:12s;"></span>
<span style="left:22%; animation-duration:16s;"></span>
<span style="left:35%; animation-duration:14s;"></span>
<span style="left:48%; animation-duration:20s;"></span>
<span style="left:60%; animation-duration:15s;"></span>
<span style="left:72%; animation-duration:18s;"></span>
<span style="left:85%; animation-duration:13s;"></span>

</div>

<!-- PLAYER -->

<div class="player" id="player">

<div class="title">
CLUB THEME MUSIC
</div>

<!-- VISUALIZER -->

<div class="visualizer">

<div class="beam"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>

<div class="light-sweep"></div>

<div class="wave-line">

<div class="bar b1"></div>
<div class="bar b2"></div>
<div class="bar b3"></div>
<div class="bar b4"></div>
<div class="bar b5"></div>
<div class="bar b6"></div>
<div class="bar b7"></div>
<div class="bar b8"></div>
<div class="bar b9"></div>
<div class="bar b10"></div>
<div class="bar b11"></div>
<div class="bar b12"></div>

</div>

</div>

<div class="status">
NOW PLAYING
</div>

<audio id="audio" controls>

<source src="https://raw.githubusercontent.com/clockmaster124/burnknucklessong/main/user8a77986840b842fe%20-%20Single%20Light%20-%20Sonauto~2.mp3" type="audio/mpeg">

</audio>

<div class="timer">

<span id="current">0:00</span>

<span id="duration">0:00</span>

</div>

</div>

<script>

const audio =
document.getElementById("audio");

const player =
document.getElementById("player");

const current =
document.getElementById("current");

const duration =
document.getElementById("duration");

audio.addEventListener("play",()=>{

    player.classList.add("playing");
});

audio.addEventListener("pause",()=>{

    player.classList.remove("playing");
});

audio.addEventListener("ended",()=>{

    player.classList.remove("playing");
});

audio.addEventListener("loadedmetadata",()=>{

    const mins =
    Math.floor(audio.duration/60);

    const secs =
    Math.floor(audio.duration%60);

    duration.textContent =
    mins + ":" + (secs < 10 ? "0":"") + secs;
});

audio.addEventListener("timeupdate",()=>{

    const mins =
    Math.floor(audio.currentTime/60);

    const secs =
    Math.floor(audio.currentTime%60);

    current.textContent =
    mins + ":" + (secs < 10 ? "0":"") + secs;
});

</script>

</body>
</html>
