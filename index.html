<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Theme Music</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at center,
    #081320 0%,
    #02060d 45%,
    #000000 100%);
}

/* BACKGROUND GLOW */

body::before{

    content:"";

    position:absolute;
    inset:-25%;

    background:

    radial-gradient(circle at 20% 20%,
    rgba(0,183,255,0.15),
    transparent 30%),

    radial-gradient(circle at 80% 70%,
    rgba(0,119,255,0.12),
    transparent 35%),

    radial-gradient(circle at 50% 50%,
    rgba(0,217,255,0.06),
    transparent 40%);

    filter:blur(70px);

    animation:aurora 18s ease infinite;
}

@keyframes aurora{

    0%{
        transform:translateX(0px);
    }

    50%{
        transform:translateX(-35px);
    }

    100%{
        transform:translateX(0px);
    }
}

/* PARTICLES */

.particles{

    position:absolute;
    inset:0;

    overflow:hidden;
}

.particles span{

    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#66d9ff;

    box-shadow:
    0 0 10px rgba(102,217,255,0.9),
    0 0 18px rgba(102,217,255,0.25);

    animation:float linear infinite;
}

@keyframes float{

    from{

        transform:
        translateY(120vh);

        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{

        transform:
        translateY(-120vh);

        opacity:0;
    }
}

/* PLAYER */

.player{

    position:relative;

    width:min(400px,88vw);

    padding:20px;

    border-radius:28px;

    overflow:hidden;

    background:
    linear-gradient(
    145deg,
    rgba(5,12,22,0.97),
    rgba(0,0,0,0.96));

    border:1px solid rgba(102,217,255,0.10);

    backdrop-filter:blur(18px);

    box-shadow:
    0 0 50px rgba(0,0,0,1),
    inset 0 0 20px rgba(102,217,255,0.04);
}

/* BORDER GLOW */

.player::before{

    content:"";

    position:absolute;
    inset:-2px;

    border-radius:30px;

    background:
    linear-gradient(
    135deg,
    #00152e,
    #0f4c81,
    #63d7ff,
    #00152e);

    background-size:300% 300%;

    animation:borderMove 10s linear infinite;

    z-index:-1;

    filter:blur(14px);

    opacity:0.35;
}

@keyframes borderMove{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

/* TITLE */

.title{

    text-align:center;

    color:#9fe8ff;

    font-size:22px;

    font-weight:900;

    letter-spacing:4px;

    text-transform:uppercase;

    margin-bottom:18px;

    text-shadow:
    0 0 10px rgba(102,217,255,0.6),
    0 0 20px rgba(102,217,255,0.2);

    animation:titlePulse 4s ease-in-out infinite;
}

@keyframes titlePulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.02);
    }
}

/* VISUALIZER */

.visualizer{

    position:relative;

    height:125px;

    border-radius:20px;

    overflow:hidden;

    background:
    linear-gradient(
    to bottom,
    rgba(255,255,255,0.015),
    rgba(102,217,255,0.025));

    border:1px solid rgba(102,217,255,0.06);

    margin-bottom:16px;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CENTER GLOW */

.core{

    position:absolute;

    width:160px;
    height:160px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(102,217,255,0.10),
    transparent 70%);

    filter:blur(35px);

    animation:corePulse 4s ease-in-out infinite;
}

@keyframes corePulse{

    0%,100%{

        transform:scale(1);

        opacity:0.35;
    }

    50%{

        transform:scale(1.15);

        opacity:1;
    }
}

/* RINGS */

.ring{

    position:absolute;

    border:1px solid rgba(102,217,255,0.08);

    border-radius:50%;
}

.playing .ring1{
    animation:ringPulse 5s infinite;
}

.playing .ring2{
    animation:ringPulse 5s infinite 2s;
}

.ring1{
    width:90px;
    height:90px;
}

.ring2{
    width:150px;
    height:150px;
}

@keyframes ringPulse{

    0%{
        transform:scale(0.8);
        opacity:0;
    }

    50%{
        opacity:0.3;
    }

    100%{
        transform:scale(1.2);
        opacity:0;
    }
}

/* LASER */

.laser{

    position:absolute;

    width:90px;
    height:180px;

    background:
    linear-gradient(
    to right,
    transparent,
    rgba(102,217,255,0.06),
    transparent);

    transform:rotate(18deg);

    animation:sweep 6s linear infinite;
}

@keyframes sweep{

    from{
        left:-120px;
    }

    to{
        left:500px;
    }
}

/* BARS */

.wave-line{

    position:relative;

    width:100%;
    height:80px;

    display:flex;

    justify-content:center;
    align-items:flex-end;

    gap:4px;

    padding:0 10px;

    z-index:5;
}

/* CENTER LINE */

.wave-line::before{

    content:"";

    position:absolute;

    width:94%;
    height:2px;

    top:50%;

    background:
    linear-gradient(
    90deg,
    transparent,
    rgba(102,217,255,0.28),
    transparent);

    filter:blur(2px);
}

/* BAR STYLE */

.bar{

    position:relative;

    width:6px;

    height:5px;

    border-radius:20px;

    background:
    linear-gradient(
    to top,
    #0d3964,
    #54d2ff,
    #e7fbff);

    box-shadow:
    0 0 12px rgba(102,217,255,0.30),
    0 0 24px rgba(102,217,255,0.10);

    transform-origin:bottom;

    opacity:0.15;
}

/* BAR GLOW */

.bar::after{

    content:"";

    position:absolute;

    left:50%;
    bottom:0;

    transform:translateX(-50%);

    width:14px;
    height:14px;

    border-radius:50%;

    background:
    radial-gradient(circle,
    rgba(102,217,255,0.15),
    transparent 70%);
}

/* PLAYING EFFECT */

.playing .bar{

    opacity:1;
}

/* ANIMATIONS */

.playing .b1{animation:eq1 1s infinite ease-in-out;}
.playing .b2{animation:eq2 1.2s infinite ease-in-out;}
.playing .b3{animation:eq3 0.9s infinite ease-in-out;}
.playing .b4{animation:eq4 1.4s infinite ease-in-out;}
.playing .b5{animation:eq5 1s infinite ease-in-out;}
.playing .b6{animation:eq6 0.8s infinite ease-in-out;}
.playing .b7{animation:eq7 1.1s infinite ease-in-out;}
.playing .b8{animation:eq8 1.3s infinite ease-in-out;}
.playing .b9{animation:eq9 0.7s infinite ease-in-out;}
.playing .b10{animation:eq10 1.2s infinite ease-in-out;}
.playing .b11{animation:eq11 1s infinite ease-in-out;}
.playing .b12{animation:eq12 0.9s infinite ease-in-out;}

@keyframes eq1{
0%,100%{height:6px;}
50%{height:26px;}
}

@keyframes eq2{
0%,100%{height:8px;}
50%{height:48px;}
}

@keyframes eq3{
0%,100%{height:10px;}
50%{height:60px;}
}

@keyframes eq4{
0%,100%{height:8px;}
50%{height:44px;}
}

@keyframes eq5{
0%,100%{height:6px;}
50%{height:36px;}
}

@keyframes eq6{
0%,100%{height:10px;}
50%{height:58px;}
}

@keyframes eq7{
0%,100%{height:8px;}
50%{height:42px;}
}

@keyframes eq8{
0%,100%{height:6px;}
50%{height:32px;}
}

@keyframes eq9{
0%,100%{height:8px;}
50%{height:62px;}
}

@keyframes eq10{
0%,100%{height:10px;}
50%{height:50px;}
}

@keyframes eq11{
0%,100%{height:8px;}
50%{height:38px;}
}

@keyframes eq12{
0%,100%{height:6px;}
50%{height:26px;}
}

/* STATUS */

.status{

    text-align:center;

    color:#9fe8ff;

    font-size:10px;

    letter-spacing:4px;

    margin-bottom:12px;

    opacity:0;

    transition:0.4s ease;
}

.playing .status{
    opacity:1;
}

/* AUDIO */

audio{

    width:100%;

    border-radius:14px;

    filter:
    drop-shadow(0 0 8px rgba(102,217,255,0.15));
}

/* TIMER */

.timer{

    margin-top:10px;

    display:flex;
    justify-content:space-between;

    color:rgba(255,255,255,0.45);

    font-size:11px;
}

/* FLASH */

.flash{

    position:absolute;
    inset:0;

    background:
    radial-gradient(circle,
    rgba(102,217,255,0.05),
    transparent 70%);

    opacity:0;
    pointer-events:none;
}

.playing .flash{

    animation:flashBeat 1.3s infinite;
}

@keyframes flashBeat{

    0%,100%{
        opacity:0;
    }

    50%{
        opacity:1;
    }
}

</style>

</head>

<body>

<div class="particles" id="particles"></div>

<div class="player" id="player">

<div class="flash"></div>

<div class="title">
CLUB THEME MUSIC
</div>

<div class="visualizer">

<div class="core"></div>

<div class="ring ring1"></div>
<div class="ring ring2"></div>

<div class="laser"></div>

<div class="wave-line">

<div class="bar b1"></div>
<div class="bar b2"></div>
<div class="bar b3"></div>
<div class="bar b4"></div>
<div class="bar b5"></div>
<div class="bar b6"></div>
<div class="bar b7"></div>
<div class="bar b8"></div>
<div class="bar b9"></div>
<div class="bar b10"></div>
<div class="bar b11"></div>
<div class="bar b12"></div>

</div>

</div>

<div class="status">
NOW PLAYING
</div>

<audio id="audio" controls>

<source src="https://raw.githubusercontent.com/clockmaster124/burnknucklessong/main/user8a77986840b842fe%20-%20Single%20Light%20-%20Sonauto~2.mp3" type="audio/mpeg">

</audio>

<div class="timer">

<span id="current">0:00</span>

<span id="duration">0:00</span>

</div>

</div>

<script>

const audio =
document.getElementById("audio");

const player =
document.getElementById("player");

const current =
document.getElementById("current");

const duration =
document.getElementById("duration");

/* PLAY */

audio.addEventListener("play",()=>{

    player.classList.add("playing");
});

/* PAUSE */

audio.addEventListener("pause",()=>{

    player.classList.remove("playing");
});

/* END */

audio.addEventListener("ended",()=>{

    player.classList.remove("playing");
});

/* TIMER */

audio.addEventListener("loadedmetadata",()=>{

    const mins =
    Math.floor(audio.duration/60);

    const secs =
    Math.floor(audio.duration%60);

    duration.textContent =
    mins + ":" + (secs < 10 ? "0":"") + secs;
});

audio.addEventListener("timeupdate",()=>{

    const mins =
    Math.floor(audio.currentTime/60);

    const secs =
    Math.floor(audio.currentTime%60);

    current.textContent =
    mins + ":" + (secs < 10 ? "0":"") + secs;
});

/* PARTICLES */

const particles =
document.getElementById("particles");

for(let i=0;i<60;i++){

    const p =
    document.createElement("span");

    p.style.left =
    Math.random()*100 + "%";

    p.style.animationDuration =
    (8 + Math.random()*12) + "s";

    p.style.opacity =
    Math.random();

    particles.appendChild(p);
}

</script>

</body>
</html>
